<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f3" />
    <title>متتبّع العادات</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">خطوات صغيرة، فرق كبير</p>
        <h1>متتبّع العادات <span aria-hidden="true">🌱</span></h1>
        <p class="subtitle">تابع تقدمك يومًا بيوم، واحتفل بكل إنجاز.</p>
      </header>

      <section class="add-panel" aria-labelledby="add-title">
        <h2 id="add-title">عادة جديدة</h2>
        <form id="habit-form">
          <label class="visually-hidden" for="habit-name">اسم العادة</label>
          <input
            id="habit-name"
            name="name"
            type="text"
            maxlength="80"
            placeholder="مثال: أشرب 8 أكواب مياه"
            required
          />
          <button class="primary-button" type="submit">أضف العادة <span aria-hidden="true">＋</span></button>
        </form>
      </section>

      <section class="progress-panel" aria-label="ملخص تقدمك">
        <article class="progress-card">
          <span class="progress-icon" aria-hidden="true">✅</span>
          <div>
            <p>إنجازات اليوم</p>
            <strong id="today-progress">٠ / ٠</strong>
          </div>
        </article>
        <article class="progress-card">
          <span class="progress-icon" aria-hidden="true">📈</span>
          <div>
            <p>إنجازات هذا الأسبوع</p>
            <strong id="week-progress">٠</strong>
          </div>
        </article>
      </section>

      <section class="habits-section" aria-labelledby="habits-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">استمر، أنت تتقدم</p>
            <h2 id="habits-title">عاداتك اليومية</h2>
          </div>
          <span id="habit-count" class="habit-count">٠ عادات</span>
        </div>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        <div id="habits-list" class="habits-list"></div>
      </section>
      <footer>الاستمرارية أهم من الكمال ✨</footer>
    </main>
  </body>
</html>
